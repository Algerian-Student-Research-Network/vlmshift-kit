# POPE mini with CLIP: a real model on real images, on a normal processor (about a minute).
# Fetch the data first: python examples/pope_mini/fetch.py
# For the two models of the POPE paper, on an NVIDIA card, use paper.yaml.
schema_version: 1
data: data/pope_mini.csv
workspace: ./workspace

roles:
  unit: image_id          # the 18 questions of one image are not independent

axes:
  mode: {type: observed}  # how the absent object was chosen: random, popular, adversarial

task:
  type: yes_no
  # CLIP does not answer: it says which of two sentences fits the image better.
  contrastive:
    positive_template: "a photo of {phrase}."   # phrase: "a bird", "an apple"
    negative_template: "a photo."

models:
  - {name: clip, adapter: contrastive, id: openai/clip-vit-base-patch32, revision: 3d74acf9a28c67741b2f4f2ea7635f0aaf6f0268}
