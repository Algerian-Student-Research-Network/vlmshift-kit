<svg viewBox="0 0 1280 320" role="img" aria-label="VLMShift. A simple kit for measuring shift in vision-language models." xmlns="http://www.w3.org/2000/svg"><rect x="1" y="1" width="1278" height="318" rx="14" fill="#ffffff" stroke="#3f7a5c" stroke-opacity=".25" stroke-width="2"/><svg viewBox="0 0 32 32" role="img" aria-label="VLMShift logo" xmlns="http://www.w3.org/2000/svg" x="64" y="78" width="64" height="64"><path d="M15,4 A10,10 0 0 0 15,24 Z" fill="#3f7a5c"/><path d="M17,8 A10,10 0 0 1 17,28 Z" fill="#3f7a5c" fill-opacity=".38"/></svg><text x="146" y="132" font-family="Newsreader, Georgia, 'Times New Roman', serif" font-size="60" fill="#1b2420">VLMShift</text><text x="66" y="208" font-family="Newsreader, Georgia, 'Times New Roman', serif" font-size="30" fill="#1b2420">A simple kit for measuring shift</text><text x="66" y="248" font-family="Newsreader, Georgia, 'Times New Roman', serif" font-size="30" fill="#1b2420">in vision-language models.</text><svg viewBox="0 0 640 300" role="img" xmlns="http://www.w3.org/2000/svg" x="700" y="38" width="520" height="244" aria-label="The same image and the same question, in English then in French. The model answers yes, then no: the gap between the two is a shift."><path class="ideal" d="M250,110 H640" fill="none" stroke="#3f7a5c" stroke-opacity=".45" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 8"/><path class="gap" d="M250,110 C280,110 280,210 310,210 H640 V110 Z" fill="#3f7a5c" fill-opacity=".12"/><path class="answer" pathLength="1" d="M4,110 H250 C280,110 280,210 310,210 H636" fill="none" stroke="#3f7a5c" stroke-width="3.5" stroke-linecap="round"/><line class="divider" x1="280" y1="20" x2="280" y2="292" stroke="#3f7a5c" stroke-opacity=".4" stroke-dasharray="3 5"/><text class="ask-en" x="4" y="78" font-family="Inter, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="32" fill="#1b2420">Is there a circle? <tspan fill="#3f7a5c" font-weight="600">Yes</tspan></text><text class="ask-fr" x="636" y="268" text-anchor="end" font-family="Inter, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="32" fill="#1b2420">Y a-t-il un cercle ? <tspan fill="#3f7a5c" font-weight="600">No</tspan></text><text class="shift" x="470" y="176" text-anchor="middle" font-family="Newsreader, Georgia, Times New Roman, serif" font-size="48" font-style="italic" fill="#3f7a5c">Shift</text></svg></svg>
