# The multilingual concept bank of the paper: 35 concepts, 7 languages, and the wordings of every
# question the models were asked (section 3).
#
# Nothing here is reconstructed. The terms are those of concept_terms.csv, the wordings those of
# prompts.py, in the code the October 2026 runs used (vlm_shift_neurips-V2). The RadLex identifiers
# are those of the annotated workbook. tests/test_med_paper.py rebuilds each prompt of these runs
# from this file and compares it with what was sent.
#
# status: the terms were drafted for the paper and not yet reviewed by a clinician who speaks
# each language. While a concept says needs_validation, paper.py refuses an official run:
# set it to validated once it is, with who reviewed it and when in `reviewed`.
#
# In a wording, {term} is the term of the concept. The concept `normal` has its own wordings: it is
# a whole-image statement, not a finding.
languages:
  EN: {family: Germanic, script: Latin, yes: ["yes"], no: ["no"]}
  FR: {family: Romance, script: Latin, yes: ["oui"], no: ["non"]}
  ES: {family: Romance, script: Latin, yes: ["sí", "si"], no: ["no"]}
  HI: {family: Indo-Aryan, script: Devanagari, yes: ["हाँ", "हां"], no: ["नहीं"]}
  ZH: {family: Sino-Tibetan, script: Han, yes: ["是"], no: ["否", "不是"]}
  AR: {family: Semitic, script: Arabic, yes: ["نعم"], no: ["لا", "كلا"]}
  DE: {family: Germanic, script: Latin, yes: ["ja"], no: ["nein"]}

# The sentence that ends a question, for each answer format.
answers:
  EN:
    english_yes_no: "Answer only YES or NO."
    numeric_10: "Answer only 1 for yes or 0 for no."
    label_ab: "Answer only A for yes or B for no."
    localized_yes_no: "Answer only Yes or No."
  FR:
    english_yes_no: "Répondez uniquement par YES ou NO."
    numeric_10: "Répondez uniquement par 1 pour oui ou 0 pour non."
    label_ab: "Répondez uniquement par A pour oui ou B pour non."
    localized_yes_no: "Répondez uniquement par Oui ou Non."
  ES:
    english_yes_no: "Responda únicamente con YES o NO."
    numeric_10: "Responda únicamente con 1 para sí o 0 para no."
    label_ab: "Responda únicamente con A para sí o B para no."
    localized_yes_no: "Responda únicamente con Sí o No."
  HI:
    english_yes_no: "केवल YES या NO में उत्तर दें।"
    numeric_10: "केवल 1 से हाँ या 0 से नहीं उत्तर दें।"
    label_ab: "केवल A से हाँ या B से नहीं उत्तर दें।"
    localized_yes_no: "केवल हाँ या नहीं में उत्तर दें।"
  ZH:
    english_yes_no: "只回答YES或NO。"
    numeric_10: "只回答1表示是，或0表示否。"
    label_ab: "只回答A表示是，或B表示否。"
    localized_yes_no: "只回答是或否。"
  AR:
    english_yes_no: "أجب فقط بـ YES أو NO."
    numeric_10: "أجب فقط بالرقم 1 لنعم أو 0 للا."
    label_ab: "أجب فقط بالحرف A لنعم أو B للا."
    localized_yes_no: "أجب فقط بنعم أو لا."
  DE:
    english_yes_no: "Antworten Sie nur mit YES oder NO."
    numeric_10: "Antworten Sie nur mit 1 für ja oder 0 für nein."
    label_ab: "Antworten Sie nur mit A für ja oder B für nein."
    localized_yes_no: "Antworten Sie nur mit Ja oder Nein."

# Questions for the generative models, and the two sentences compared by the contrastive ones.
templates:
  EN:
    canonical: "Is there evidence of {term} in this chest X-ray?"
    paraphrase_1: "Does this chest X-ray show {term}?"
    paraphrase_2: "Is {term} present in this chest radiograph?"
    negated: "Is there no evidence of {term} in this chest X-ray?"
    canonical_pair: ["This chest X-ray shows {term}.", "This chest X-ray does not show {term}."]
    paraphrase_1_pair: ["The chest radiograph contains evidence of {term}.", "The chest radiograph contains no evidence of {term}."]
    paraphrase_2_pair: ["{term} is present on this chest X-ray.", "{term} is absent on this chest X-ray."]
    normal: {canonical: "Is this chest X-ray normal?", negated: "Is this chest X-ray abnormal?", pair: ["This chest X-ray is normal.", "This chest X-ray is abnormal."]}
  FR:
    canonical: "Y a-t-il des signes de {term} sur cette radiographie thoracique ?"
    paraphrase_1: "Cette radiographie thoracique montre-t-elle {term} ?"
    paraphrase_2: "Observe-t-on {term} sur cette radiographie thoracique ?"
    negated: "N'y a-t-il aucun signe de {term} sur cette radiographie thoracique ?"
    canonical_pair: ["Cette radiographie thoracique montre {term}.", "Cette radiographie thoracique ne montre pas {term}."]
    paraphrase_1_pair: ["Cette radiographie thoracique présente des signes de {term}.", "Cette radiographie thoracique ne présente aucun signe de {term}."]
    paraphrase_2_pair: ["{term} est présent sur cette radiographie thoracique.", "{term} est absent sur cette radiographie thoracique."]
    normal: {canonical: "Cette radiographie thoracique est-elle normale ?", negated: "Cette radiographie thoracique est-elle anormale ?", pair: ["Cette radiographie thoracique est normale.", "Cette radiographie thoracique est anormale."]}
  ES:
    canonical: "¿Hay evidencia de {term} en esta radiografía de tórax?"
    paraphrase_1: "¿Esta radiografía de tórax muestra {term}?"
    paraphrase_2: "¿Está presente {term} en esta radiografía de tórax?"
    negated: "¿No hay evidencia de {term} en esta radiografía de tórax?"
    canonical_pair: ["Esta radiografía de tórax muestra {term}.", "Esta radiografía de tórax no muestra {term}."]
    paraphrase_1_pair: ["Esta radiografía de tórax presenta signos de {term}.", "Esta radiografía de tórax no presenta signos de {term}."]
    paraphrase_2_pair: ["{term} está presente en esta radiografía de tórax.", "{term} está ausente en esta radiografía de tórax."]
    normal: {canonical: "¿Esta radiografía de tórax es normal?", negated: "¿Esta radiografía de tórax es anormal?", pair: ["Esta radiografía de tórax es normal.", "Esta radiografía de tórax es anormal."]}
  HI:
    canonical: "क्या इस छाती के एक्स-रे में {term} के संकेत हैं?"
    paraphrase_1: "क्या यह छाती का एक्स-रे {term} दिखाता है?"
    paraphrase_2: "क्या इस छाती के एक्स-रे में {term} मौजूद है?"
    negated: "क्या इस छाती के एक्स-रे में {term} का कोई संकेत नहीं है?"
    canonical_pair: ["यह छाती का एक्स-रे {term} दिखाता है।", "यह छाती का एक्स-रे {term} नहीं दिखाता है।"]
    paraphrase_1_pair: ["इस छाती के एक्स-रे में {term} के संकेत हैं।", "इस छाती के एक्स-रे में {term} के कोई संकेत नहीं हैं।"]
    paraphrase_2_pair: ["इस छाती के एक्स-रे में {term} मौजूद है।", "इस छाती के एक्स-रे में {term} मौजूद नहीं है।"]
    normal: {canonical: "क्या यह छाती का एक्स-रे सामान्य है?", negated: "क्या यह छाती का एक्स-रे असामान्य है?", pair: ["यह छाती का एक्स-रे सामान्य है।", "यह छाती का एक्स-रे असामान्य है।"]}
  ZH:
    canonical: "这张胸部X光片是否显示{term}？"
    paraphrase_1: "这张胸部X光片中是否存在{term}？"
    paraphrase_2: "这张胸片上是否可见{term}？"
    negated: "这张胸部X光片是否没有{term}的证据？"
    canonical_pair: ["这张胸部X光片显示{term}。", "这张胸部X光片未显示{term}。"]
    paraphrase_1_pair: ["这张胸部X光片有{term}的证据。", "这张胸部X光片没有{term}的证据。"]
    paraphrase_2_pair: ["这张胸部X光片中存在{term}。", "这张胸部X光片中不存在{term}。"]
    normal: {canonical: "这张胸部X光片是否正常？", negated: "这张胸部X光片是否异常？", pair: ["这张胸部X光片正常。", "这张胸部X光片异常。"]}
  AR:
    canonical: "هل توجد علامات تدل على {term} في صورة الأشعة السينية للصدر هذه؟"
    paraphrase_1: "هل تُظهر صورة الأشعة السينية للصدر هذه {term}؟"
    paraphrase_2: "هل يظهر {term} في صورة الأشعة السينية للصدر هذه؟"
    negated: "هل لا توجد علامات تدل على {term} في صورة الأشعة السينية للصدر هذه؟"
    canonical_pair: ["تُظهر صورة الأشعة السينية للصدر هذه {term}.", "لا تُظهر صورة الأشعة السينية للصدر هذه {term}."]
    paraphrase_1_pair: ["توجد في صورة الأشعة السينية للصدر هذه علامات على {term}.", "لا توجد في صورة الأشعة السينية للصدر هذه علامات على {term}."]
    paraphrase_2_pair: ["يوجد {term} في صورة الأشعة السينية للصدر هذه.", "لا يوجد {term} في صورة الأشعة السينية للصدر هذه."]
    normal: {canonical: "هل صورة الأشعة السينية للصدر هذه طبيعية؟", negated: "هل صورة الأشعة السينية للصدر هذه غير طبيعية؟", pair: ["صورة الأشعة السينية للصدر هذه طبيعية.", "صورة الأشعة السينية للصدر هذه غير طبيعية."]}
  DE:
    canonical: "Gibt es auf dieser Thoraxaufnahme Hinweise auf {term}?"
    paraphrase_1: "Zeigt diese Thoraxaufnahme {term}?"
    paraphrase_2: "Ist auf dieser Thoraxaufnahme {term} vorhanden?"
    negated: "Gibt es auf dieser Thoraxaufnahme keinen Hinweis auf {term}?"
    canonical_pair: ["Diese Thoraxaufnahme zeigt {term}.", "Diese Thoraxaufnahme zeigt kein {term}."]
    paraphrase_1_pair: ["Auf dieser Thoraxaufnahme bestehen Hinweise auf {term}.", "Auf dieser Thoraxaufnahme bestehen keine Hinweise auf {term}."]
    paraphrase_2_pair: ["{term} ist auf dieser Thoraxaufnahme vorhanden.", "{term} ist auf dieser Thoraxaufnahme nicht vorhanden."]
    normal: {canonical: "Ist diese Thoraxaufnahme normal?", negated: "Ist diese Thoraxaufnahme abnormal?", pair: ["Diese Thoraxaufnahme ist normal.", "Diese Thoraxaufnahme ist abnormal."]}

