# The multilingual concept bank: one wording per language, one term per concept (section 3).
#
# The question and the two sentences are the same for every concept: only {term} changes, so
# language is the only thing that varies between the 7 rows of one image and one concept. The
# answer is always YES or NO in English, whatever the language of the question.
#
# The paper names neither its 35 concepts nor its wordings: this bank is rebuilt from the labels
# of the 11 sources (docs/decisions.md). The translations must be checked by a doctor who speaks
# the language before any result is published.
templates:
  EN:
    question: "Finding: {term}. Is this finding present on this chest X-ray? Answer only YES or NO."
    positive: "a chest X-ray with {term}"
    negative: "a chest X-ray without {term}"
  FR:
    question: "Signe radiologique : {term}. Ce signe est-il présent sur cette radiographie thoracique ? Répondez uniquement par YES ou NO."
    positive: "une radiographie thoracique avec {term}"
    negative: "une radiographie thoracique sans {term}"
  ES:
    question: "Hallazgo: {term}. ¿Está presente este hallazgo en esta radiografía de tórax? Responda solo YES o NO."
    positive: "una radiografía de tórax con {term}"
    negative: "una radiografía de tórax sin {term}"
  DE:
    # "mit dem Befund {term}": the term stays as written, whatever its gender or case.
    question: "Befund: {term}. Ist dieser Befund auf diesem Röntgenbild des Thorax vorhanden? Antworten Sie nur mit YES oder NO."
    positive: "ein Röntgenbild des Thorax mit dem Befund {term}"
    negative: "ein Röntgenbild des Thorax ohne den Befund {term}"
  AR:
    question: "الموجودة: {term}. هل هذه الموجودة ظاهرة في صورة الأشعة السينية للصدر هذه؟ أجب فقط بـ YES أو NO."
    positive: "صورة أشعة سينية للصدر تُظهر {term}"
    negative: "صورة أشعة سينية للصدر بدون {term}"
  HI:
    question: "निष्कर्ष: {term}। क्या यह निष्कर्ष इस छाती के एक्स-रे में मौजूद है? केवल YES या NO में उत्तर दें।"
    positive: "{term} वाला छाती का एक्स-रे"
    negative: "{term} के बिना छाती का एक्स-रे"
  ZH:
    question: "所见：{term}。这张胸部X光片中是否有该所见？请只回答 YES 或 NO。"
    positive: "有{term}的胸部X光片"
    negative: "无{term}的胸部X光片"

